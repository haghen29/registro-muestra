<!DOCTYPE html>
<html lang="es-AR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Cartel QR · Muestra Educativa · E.E.S.T. N°4</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/styles.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { overflow-x: hidden; }
    .tools { max-width: 720px; margin: 16px auto; padding: 0 16px; display: flex; gap: 10px; flex-wrap: wrap; }
    .tools .input { flex: 1 1 100%; min-width: 0; }
    .tools .btn { flex: 1 1 140px; }
    @media (min-width: 640px) {
      .tools { margin: 24px auto; }
      .tools .input { flex: 1 1 280px; }
      .tools .btn { flex: 0 0 auto; }
    }
    .poster {
      width: 190mm; max-width: calc(100% - 32px); margin: 0 auto 40px;
      background: var(--navy); color: #fff; border-radius: 18px; overflow: hidden;
      text-align: center;
    }
    .poster-top { padding: 22px 16px 4px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
    .logos { display: flex; align-items: center; justify-content: center; gap: clamp(14px, 5vw, 32px); }
    .logos img { height: clamp(56px, 17vw, 90px); width: auto; }
    .poster h1 { margin: 10px 0 0; font-size: clamp(2rem, 9vw, 3.6rem); font-weight: 800; font-stretch: 115%; line-height: 1; letter-spacing: -0.02em; }
    .poster p { margin: 10px 8px 0; font-size: clamp(1.05rem, 4.2vw, 1.3rem); color: #c9d6e8; }
    .qr-box { background: #fff; display: inline-block; padding: clamp(10px, 3vw, 18px); border-radius: 16px; margin: 22px 0; max-width: calc(100% - 32px); }
    .qr-box img, .qr-box canvas { display: block; width: 100mm !important; height: auto !important; max-width: 100%; aspect-ratio: 1; }
    .poster-bottom { background: var(--accent); color: var(--accent-ink); padding: 16px; font-weight: 700; font-size: clamp(1.05rem, 4.2vw, 1.25rem); }
    .poster-url { display: block; font-weight: 600; font-size: .95rem; margin-top: 4px; overflow-wrap: anywhere; }
    /* Créditos: chicos y discretos, al pie del cartel */
    .poster .poster-credits { margin: 0; padding: 7px 16px 8px; font-size: .72rem; line-height: 1.35; color: #8fa3bf; }
    @media print {
      @page { size: A4; margin: 10mm; }
      body { background: #fff; }
      .tools { display: none; }
      .poster { margin: 0 auto; max-width: none; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      .logos img { height: 90px; }
      .qr-box { padding: 18px; }
    }
  </style>
</head>
<body>
  <div class="tools">
    <input class="input" id="url" type="url" inputmode="url" aria-label="Dirección del formulario">
    <button class="btn btn-dark" id="gen" type="button">Actualizar QR</button>
    <button class="btn btn-primary" onclick="window.print()" type="button">Imprimir cartel</button>
  </div>

  <article class="poster">
    <div class="poster-top">
      <div class="logos">
        <img src="https://tecnica4berazategui.edu.ar/img/LogoTec4Blanco.png" alt="Logo E.E.S.T. N°4" onerror="this.remove()">
      </div>
      <h1>Muestra educativa</h1>
      <p>Escaneá el código con la cámara del celular y registrate para entrar.</p>
    </div>
    <div class="qr-box" id="qr"></div>
    <div class="poster-bottom">
      Mostrá la pantalla verde en la puerta
      <span class="poster-url" id="url-text"></span>
    </div>
    <p class="poster-credits">Desarrollado por Eluney Alcaraz, Adrian Estigarribia, Santino Borio Perez, Leandro Burgos, Leila Luna y Mateo Castillo</p>
  </article>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script>
    const input = document.getElementById('url');
    input.value = location.origin + '/';
    function generar() {
      const box = document.getElementById('qr');
      box.innerHTML = '';
      new QRCode(box, { text: input.value, width: 600, height: 600, correctLevel: QRCode.CorrectLevel.M });
      document.getElementById('url-text').textContent = input.value.replace(/^https?:\/\//, '').replace(/\/$/, '');
    }
    document.getElementById('gen').addEventListener('click', generar);
    generar();
  </script>
</body>
</html>
